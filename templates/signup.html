<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker - Sign Up</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% load static %}
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .login-wrapper {
            position: relative;
            width: 95vw;
            max-width: 1400px;
            aspect-ratio: 16/9;
            background-image: url("{% static 'img/clean_bg.jpg' %}");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 12px;
        }

        /* The form positioned perfectly within the blank decorative frame */
        .form-container {
            position: absolute;
            top: 20%;
            left: 42%;
            width: 36%;
            height: 60%;
            padding: 2% 4%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Form Styling */
        .form-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.8vw;
            color: #1b1b1b;
            margin: 0 0 1% 0;
            font-weight: 700;
        }

        .form-subtitle {
            text-align: center;
            font-size: 0.8vw;
            color: #444;
            margin-bottom: 4%;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 3%;
        }

        .input-group input {
            width: 100%;
            padding: 3% 4% 3% 4%;
            background-color: transparent;
            border: 1px solid rgba(181, 168, 127, 0.8);
            border-radius: 6px;
            font-size: 1vw;
            color: #333;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #10331b;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 3%;
            background-color: #0d3b1f; /* Dark Green */
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1vw;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(13, 59, 31, 0.4);
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 4%;
        }

        .btn-submit:hover {
            background-color: #082915;
        }

        .signup-link {
            text-align: center;
            margin-top: 4%;
            font-size: 0.8vw;
            color: #555;
        }

        .signup-link a {
            color: #0d3b1f;
            font-weight: 600;
            text-decoration: none;
        }

        .messages {
            text-align: center;
            color: #d93025;
            font-size: 0.9vw;
            margin-bottom: 2%;
        }

        /* Adjusting Django forms rendering slightly */
        .form-container form p {
            margin: 0 0 10px 0;
            font-size: 1vw;
            color: #333;
        }
        .form-container form p label {
            display: none;
        }
        
        @media (min-width: 1200px) {
            .form-title { font-size: 22px; }
            .form-subtitle { font-size: 11px; }
            .input-group input { font-size: 14px; padding: 10px 15px; }
            .btn-submit { font-size: 14px; padding: 12px; }
            .signup-link { font-size: 11px; }
            .form-container form p { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="form-container">
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle">Join Smart Expense Tracker</p>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div>{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="input-group">
                    {{ form.username }}
                </div>
                <div class="input-group">
                    {{ form.email }}
                </div>
                <div class="input-group">
                    {{ form.password }}
                </div>
                <div class="input-group">
                    {{ form.confirm_password }}
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <div class="signup-link">
                Already have an account? <a href="{% url 'login' %}">Login</a>
            </div>
        </div>
    </div>

</body>
<script>
    // Just adding placeholders to Django's auto-generated form fields
    document.querySelectorAll('.input-group input').forEach(input => {
        if(input.name === 'username') input.placeholder = 'Username';
        if(input.name === 'email') input.placeholder = 'Email';
        if(input.name === 'password') input.placeholder = 'Password';
        if(input.name === 'confirm_password') input.placeholder = 'Confirm Password';
    });
</script>
</html>
